services:
  postgres:
    image: 'postgres:latest'
    environment:
      - 'POSTGRES_DB=mydatabase'
      - 'POSTGRES_PASSWORD=secret'
      - 'POSTGRES_USER=myuser'
    ports:
      - '5432'
  redis:
    image: 'redis:latest'
    ports:
      - '6379'
  # W3 Kafka Saga 용 로컬 브로커. KRaft 단일 노드(Zookeeper 없음).
  # 포트를 9092 로 고정하는 건 Kafka 만의 사정 — advertised.listeners 가 클라이언트에게
  # 자기 주소를 되돌려주므로, Postgres/Redis 처럼 랜덤 포트로 두면 브로커가 런타임에
  # 못 정해진 포트를 광고해 접속이 깨진다. 9092 고정이면 advertised 도 Spring Kafka
  # 기본 bootstrap(localhost:9092)도 일치해 속성 설정 없이 붙는다.
  kafka:
    image: 'apache/kafka:3.9.1'
    ports:
      - '9092:9092'
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: 'broker,controller'
      KAFKA_LISTENERS: 'PLAINTEXT://:9092,CONTROLLER://:9093'
      KAFKA_ADVERTISED_LISTENERS: 'PLAINTEXT://localhost:9092'
      KAFKA_CONTROLLER_LISTENER_NAMES: 'CONTROLLER'
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: 'CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT'
      KAFKA_CONTROLLER_QUORUM_VOTERS: '1@localhost:9093'
      # 단일 노드라 복제 계수는 전부 1 (기본값 3 이면 토픽 생성이 막힌다)
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
    healthcheck:
      test: ['CMD', '/opt/kafka/bin/kafka-topics.sh', '--bootstrap-server', 'localhost:9092', '--list']
      interval: 10s
      timeout: 10s
      retries: 10
