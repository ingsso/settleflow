# 종료 시 in-flight 요청을 기다린다(W4D5 결정, D4 §8 이월 청산).
#
# 왜 켜나: 부하 중 강제 종료로 만든 고아(SETNX 는 통과했고 커밋 전에 죽은 요청)가
# kill 에서 23건이었는데 graceful 에서는 0건이었다 — 그것도 in-flight 가 더 많은 순간
# (175 vs 99)에 0이라 대조가 강해지는 방향이었다(W4D4 §7·§8 실측).
#
# 대가를 재고 켰다. 같은 종료 경로(/actuator/shutdown)에 이 설정만 바꿔 비교했다:
#   [실측] 재시도 진행 중·HTTP 부하 0 : immediate 2,190ms / graceful 2,255ms  (+65ms)
#   [실측] 포화 부하(RATE=300)        : immediate 8,963·8,757ms
#                                       graceful  9,674·8,001ms
# 조건 내부 편차(1,673ms)가 조건 사이 차이보다 커서 "graceful 이 얼마나 더 걸린다"를
# 말할 수 없다 — 말할 수 있는 건 대가가 노이즈보다 작다는 것이다. 그리고 종료 시간은
# 이 설정이 아니라 부하가 지배한다(무부하 2.2초 → 포화 8~9초, immediate 도 같다).
#
# ⚠️ 안 잰 구간이 있다: spring.lifecycle.timeout-per-shutdown-phase(기본 30초)라는 상한은
# 실재하고, in-flight 가 30초 넘게 안 끝나는 구간은 측정하지 않았다. 거기서는 잘린다.
# ⚠️ 표본이 조건당 2회다. "차이 없음"이 아니라 "차이를 못 봤다"로 읽을 것.
server:
  shutdown: graceful

spring:
  application:
    name: settleflow
  # 아웃박스 릴레이가 String 키(aggregateId)·String 값(JSON payload)을 그대로 보낸다(W3D1).
  # bootstrap-servers 는 설정하지 않는다 — 로컬은 compose 의 9092 고정과 Spring Kafka 기본값이
  # 일치하고, 테스트는 Testcontainers @ServiceConnection 이 컨테이너 포트로 덮어쓴다.
  kafka:
    producer:
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.apache.kafka.common.serialization.StringSerializer
    # 환불 Saga 소비자(W3D2). 값은 JSON 문자열 그대로 받아 리스너가 직접 역직렬화한다 —
    # JsonDeserializer 의 타입 헤더 신뢰 문제를 피하고, 발행 측(String 직렬화)과 대칭을 맞춘다.
    consumer:
      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      value-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      # 소비자가 붙기 전에 발행된 이벤트도 처리해야 한다 — 아웃박스는 유실을 막으려고 존재하는데
      # 소비자가 latest 로 시작하면 그 사이 이벤트를 아무도 안 집는다.
      auto-offset-reset: earliest

# 환불 Saga 소비자 재시도(W4D5). 근거·판단은 RefundSagaErrorHandlingConfig javadoc 에 있다.
#
# ★ 상한이 여기 없는 게 실수가 아니다. 재시도 횟수·총 시간 상한을 설정 항목으로 열어두지 않는다 —
#   "포기하지 않는다"가 이 정책의 내용 그 자체이고(환불은 이미 진 빚이라 포기하면 돈이 조용히
#   안 나간다), 항목으로 있으면 조용히 되돌려진다. 조절하는 건 간격뿐이다.
#
# max-interval 이 30s 인 이유는 회로가 아니라 컨슈머 쪽이다: 블로킹 재시도라 대기 중 컨슈머
# 스레드가 멈추고, 한 번의 대기가 max.poll.interval.ms(기본 300s)를 넘으면 그룹에서 쫓겨난다.
settleflow:
  # 웹훅 발신자 검증(WebhookSignatureVerifier). 시크릿에 기본값을 두지 않는다 — 기본값이 있으면
  # 운영에서 환경변수를 빠뜨려도 앱이 떠서 "아무나 아는 시크릿"으로 서명을 받는다. 없으면 기동 실패.
  # 로컬 bootRun: PowerShell 에서 $env:WEBHOOK_SECRET = "..." 후 실행. 테스트는 IntegrationTestSupport 가 덮는다.
  webhook:
    secret: ${WEBHOOK_SECRET}
    # 시크릿 교체 기간에만 직전 키를 넣는다(검증 전용). 비어 있으면 현재 키만 허용.
    # 여기는 기본값(빈 값)이 있어도 된다 — 빈 값은 "구 키 없음"이라 아무 키도 허용하지 않는다.
    # 교체 순서·구 키 제거 시점은 WebhookMetrics javadoc 과 시크릿 교체 가이드 참조.
    previous-secret: ${WEBHOOK_SECRET_PREVIOUS:}
    # 서명 시각과 서버 시각의 허용 차. 이 창 안의 재전송은 eventId 멱등 처리가 막는다.
    tolerance-seconds: 300
  kafka:
    refund-retry:
      initial-interval: 2s
      multiplier: 1.5
      max-interval: 30s

# PG 장애 격리(W4D1). 회로를 승인/환불 둘로 나눈 이유는 ResilientPgClient javadoc 참조 —
# 실패의 뜻이 다르다(승인은 빚이 안 생기고, 환불은 이미 진 빚이다).
#
# 무엇이 실패로 세어지나: 예외만. PG 거절은 반환값이라 회로를 안 흔든다 — 거절은 PG 가 멀쩡히
# 답한 것이고 격리할 장애가 아니다. 실질적으로 회로를 여는 건 PgTimeoutException 이다.
resilience4j:
  circuitbreaker:
    instances:
      pg-approve:
        # COUNT_BASED: 최근 N건 중 실패율로 판단. 시간 기준(TIME_BASED)이 아닌 건 트래픽이
        # 없는 시간대에 오래된 실패가 창에 남아 판단을 흐리는 걸 피하려는 것.
        sliding-window-type: COUNT_BASED
        sliding-window-size: 20
        # 표본이 적을 때 성급히 열지 않는다 — 2건 중 1건 실패로 50% 가 되면 안 된다.
        minimum-number-of-calls: 10
        failure-rate-threshold: 50
        # 열린 뒤 이만큼은 아무것도 안 보낸다. 짧으면 죽은 PG 를 계속 두드리고,
        # 길면 회복을 늦게 알아챈다.
        wait-duration-in-open-state: 30s
        # HALF_OPEN 에서 흘려보낼 시험 호출 수. 이게 실패하면 다시 OPEN.
        permitted-number-of-calls-in-half-open-state: 3
        # 자동 전이는 끈다(기본값) — 백그라운드 스케줄러 없이, 대기 시간이 지난 뒤 들어온
        # 다음 호출이 HALF_OPEN 을 연다. 트래픽이 없으면 열어볼 이유도 없다.
        automatic-transition-from-open-to-half-open-enabled: false
      pg-refund:
        # 승인과 같은 값으로 시작한다. 다른 값을 줄 근거가 아직 실측에 없다 —
        # 나누는 것 자체가 오늘의 판단이고, 값을 가르는 건 근거가 생기면 그때.
        sliding-window-type: COUNT_BASED
        sliding-window-size: 20
        minimum-number-of-calls: 10
        failure-rate-threshold: 50
        wait-duration-in-open-state: 30s
        permitted-number-of-calls-in-half-open-state: 3
        automatic-transition-from-open-to-half-open-enabled: false

# 관측(W4D2). actuator 와 micrometer-registry-prometheus 는 W1 스캐폴딩부터 클래스패스에
# 있었지만 노출 설정이 한 줄도 없어 /actuator/prometheus 가 닫혀 있었다 — W4D1 스모크가
# "증명 안 한 것: 메트릭 노출(W4D2 소관)"으로 남긴 자리다.
#
# ★ 왜 Prometheus 인가 — DB 로도 되는 것과 안 되는 것을 갈라야 한다.
# 불일치 건수는 이미 reconciliation_run 에 append-only 로 쌓이고, Grafana 는 Postgres 를
# 데이터소스로 직접 붙일 수 있어 SQL 한 줄로 그려진다. 알림도 마찬가지다. 그래서 "실시간"은
# 근거가 아니다 — 이 배치는 하루 1회라 실시간이랄 게 없다. 실제 근거는 둘:
#   ① 저장 경로를 감시 대상에서 뗀다. Postgres 가 죽으면 SQL 알림도 같이 죽는다.
#      W3D4(금액 계산의 독립) · W3D5 ③(볼 목록의 독립) 에 이어 세 번째 반복이고,
#      이번에 독립시키는 건 "어디에 남기나" 다.
#   ② DB 행은 커밋돼야 생긴다 — 진행 중인 배치와 안 돈 배치를 DB 는 구분 못 한다.
#      소요시간과 회로 상태는 DB 에 아예 안 남는다.
#
# ⚠️ 정직한 한계: 이 독립은 완전하지 않다. Prometheus 를 같은 compose.yaml 에 두면
# `docker compose down` 한 번에 같이 죽는다. 실제로 얻는 건 "DB 와 다른 저장 경로"까지지
# "독립된 관측"이 아니다 — 없는 독립을 있다고 쓰면 W3D3 §8 의 함정이다.
management:
  endpoints:
    web:
      exposure:
        # prometheus 는 기본 노출 목록에 없다 — 안 적으면 404 다(에러가 아니라 그냥 없음).
        include: health,info,prometheus
  endpoint:
    health:
      # 로컬 전용. 인증이 붙으면 이 값을 되돌린다.
      show-details: always
  health:
    # 회로 상태를 health 에도 싣는다. 켜야 나온다 — resilience4j 는 기본이 false 다.
    circuitbreakers:
      enabled: true
  prometheus:
    metrics:
      export:
        enabled: true
