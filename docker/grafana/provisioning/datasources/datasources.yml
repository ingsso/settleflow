# Grafana 데이터소스 자동 프로비저닝(W4D2).
# UI 로 손수 꽂으면 컨테이너를 지울 때 같이 사라진다 — 대시보드 스크린샷이 최종 산출물이라
# 재현 가능해야 한다(계획서 최종 산출물 체크리스트).
#
# ★ 두 데이터소스를 나란히 두는 게 오늘 설계의 표현이다.
#   Prometheus = 수위(지금 몇 건인가 · 회로가 열렸나 · 배치가 몇 초 걸렸나)
#   Postgres   = 명세(어느 날짜의 어느 셀러가 얼마나 어긋났나)
# 라벨 카디널리티 때문에 sellerId·settlementDate 를 메트릭 태그로 안 달았고(W4D2),
# 그래서 "그 날짜가 궁금하면 DB 를 본다" 가 성립하려면 이 둘이 같은 화면에 있어야 한다.

apiVersion: 1

datasources:
  - name: Prometheus
    type: prometheus
    # uid 를 고정한다 — 대시보드 JSON 이 이 이름으로 데이터소스를 가리킨다.
    # 자동 생성 uid 에 맡기면 컨테이너를 다시 만들 때 대시보드의 참조가 깨진다.
    uid: settleflow-prometheus
    access: proxy
    # 컨테이너 간 통신이라 compose 서비스 이름을 쓴다(host.docker.internal 이 아니다) —
    # 호스트를 거치는 건 앱을 긁을 때뿐이다.
    url: http://prometheus:9090
    isDefault: true
    editable: true

  - name: Postgres
    type: postgres
    uid: settleflow-postgres
    access: proxy
    # compose 의 postgres 는 포트를 랜덤 매핑하지만, 여기선 컨테이너 네트워크 안에서
    # 5432 로 직접 붙으므로 매핑과 무관하다.
    url: postgres:5432
    database: mydatabase
    user: myuser
    jsonData:
      sslmode: disable
      postgresVersion: 1600
    secureJsonData:
      password: secret
    editable: true
