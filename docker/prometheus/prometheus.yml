# SettleFlow 스크레이프 설정(W4D2).
#
# ★ 대상이 host.docker.internal 인 이유 — 앱은 컨테이너 안이 아니라 호스트에서 돈다.
# 개발 중엔 `./gradlew bootRun` 으로 띄우므로 Prometheus 컨테이너가 자기 네트워크 안에서
# 'settleflow' 를 찾으면 못 찾는다. compose 의 extra_hosts 가 이 이름을 호스트 게이트웨이로
# 풀어준다(Docker Desktop 은 기본 제공, Linux 는 host-gateway 매핑이 있어야 한다).
#
# 앱까지 컨테이너로 넣으면 이 우회가 없어지지만, 그러면 코드 고칠 때마다 이미지를 다시
# 굽게 된다. 개발 루프를 지키는 쪽을 골랐다.

global:
  # 15s 는 회로 상태를 위한 값이다 — 그건 지금 일어나는 일이라 성기게 보면 놓친다.
  # 정산·대사 지표는 하루 1회라 이 간격이 과하지만, 같은 앱을 두 번 긁을 이유는 없다.
  # 하루 한 번 바뀌는 값을 5,760번 다시 읽는 셈인데 그 비용이 회로를 놓치는 것보다 싸다.
  scrape_interval: 15s
  scrape_timeout: 10s

scrape_configs:
  - job_name: 'settleflow'
    # actuator 기본 경로가 아니다 — management.endpoints.web.exposure.include 에
    # prometheus 를 안 적으면 여기서 404 가 되고, 그건 에러가 아니라 조용한 부재다.
    metrics_path: '/actuator/prometheus'
    static_configs:
      - targets: ['host.docker.internal:8080']
        labels:
          # 나중에 인스턴스가 늘면 이 라벨로 가른다. 지금은 하나뿐이라 상수다.
          env: 'local'

  # Prometheus 자기 자신. up{job="prometheus"} 가 있어야 "긁는 쪽이 살아 있다"와
  # "긁히는 쪽이 죽었다"를 가를 수 있다 — 앱만 대상으로 두면 둘이 같은 모양이 된다.
  - job_name: 'prometheus'
    static_configs:
      - targets: ['localhost:9090']
